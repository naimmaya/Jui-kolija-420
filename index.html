<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For You ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="stars"></div>

  <main class="container">

    <div class="heart-wrap">
      <div class="heart">♥</div>
    </div>

    <h1>For You ❤️</h1>

    <p class="subtitle">
      You are the most beautiful part of my story.
    </p>

    <div class="message-card">
      <div class="card-heart">♡</div>

      <h2>My Message</h2>

      <p>
        Some people come into our lives and make everything
        a little more beautiful. You are one of those people.
      </p>

      <p class="love-text">
        Forever & Always ❤️
      </p>
    </div>

    <button id="loveBtn">Click Me ❤️</button>

    <div id="popup" class="popup">
      <span>💗</span>
      <p>You are special to me ❤️</p>
    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
